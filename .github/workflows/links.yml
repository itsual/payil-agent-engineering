name: Check reference links

# The lessons link to third-party documentation, which moves. Once a month (and on demand) confirm
# every reference still resolves. A broken link fails the run so it shows up in the Actions tab.

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check every reference link
        run: node scripts/check-links.mjs
